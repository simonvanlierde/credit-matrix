<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CRediT Matrix">
  <!-- A 3x3 crop of the contribution matrix. Cell fills are the app's real
       intensity tiers (see src/core/contributor-color.ts): white mixed
       0.4 / 0.7 / 1.0 toward ink-blue, plus the empty-cell fill. Dark values
       mirror the .dark tokens in globals.css. -->
  <style>
    .ground { fill: #fafaf9 } .edge { stroke: #d8d8d4 }
    .lead { fill: #1f4e79 } .equal { fill: #6283a1 }
    .supporting { fill: #a5b8c9 } .none { fill: #ececea }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #1e2024 } .edge { stroke: #3a3d42 }
      .lead { fill: #a8c1da } .equal { fill: #71879e }
      .supporting { fill: #455465 } .none { fill: #2a2c30 }
    }
  </style>
  <rect class="ground" width="32" height="32" rx="6"/>
  <rect class="edge" x=".5" y=".5" width="31" height="31" rx="5.5" fill="none"/>
  <g>
    <rect class="lead"        x="3"  y="3"  width="8" height="8" rx="1"/>
    <rect class="equal"       x="12" y="3"  width="8" height="8" rx="1"/>
    <rect class="supporting"  x="21" y="3"  width="8" height="8" rx="1"/>
    <rect class="equal"       x="3"  y="12" width="8" height="8" rx="1"/>
    <rect class="lead"        x="12" y="12" width="8" height="8" rx="1"/>
    <rect class="none"        x="21" y="12" width="8" height="8" rx="1"/>
    <rect class="supporting"  x="3"  y="21" width="8" height="8" rx="1"/>
    <rect class="none"        x="12" y="21" width="8" height="8" rx="1"/>
    <rect class="lead"        x="21" y="21" width="8" height="8" rx="1"/>
  </g>
</svg>
