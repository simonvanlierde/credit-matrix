name: Release package

# Publishes src/core as the `credit-matrix` npm package when a release is tagged.
# npm trusted publishing: npm checks this workflow's GitHub OIDC token, so
# there is no npm token to store or leak. docs/deploy.md has the one-time setup.
#
# Two jobs: `build` installs and runs project code with read-only rights and
# packs the tarball; `publish` holds the OIDC token, runs in the `npm-release`
# environment (limited to v* tags) and only uploads that tarball.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test the package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      # Full history, so the check below can see whether the tag is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."
            exit 1
          fi

      # No dependency cache: a release builds only from the lockfile.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          node-version-file: .node-version
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        run: |
          version=$(node -p 'require("./src/core/package.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match src/core/package.json version $version."
            exit 1
          fi

      # Builds dist/ (global setup), then runs every core test against it.
      - name: Test the package
        run: pnpm exec vitest run --project core

      # prepack rebuilds dist/ before the tarball is made.
      - name: Pack
        id: pack
        working-directory: src/core
        # pipefail: otherwise a failed pack leaves tarball empty and the
        # upload below takes the whole src/core directory instead.
        run: |
          set -o pipefail
          tarball=$(npm pack --silent | tail -n 1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package
          path: src/core/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      # Only the version file the setup step reads; nothing from the repo runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .node-version
          sparse-checkout-cone-mode: false

      # setup-node, not pnpm/setup: pnpm's Node runtime comes without npm, so
      # `npm` would be the runner's older system npm.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Check npm supports trusted publishing
        run: |
          version=$(npm --version)
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$version"; then
            echo "::error::npm $version is too old for trusted publishing (needs 11.5.1 or later)."
            exit 1
          fi

      - name: Publish
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./$TARBALL" --provenance --access public
