name: CodSpeed

on:
  # Only pull requests that can move a benchmark. Pushes to main always run, so the newest main
  # commit, which CodSpeed compares a pull request with, has a result.
  pull_request:
    paths:
      - "census/**"
      - "src/core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - "vitest.bench.config.mts"
      - ".github/workflows/codspeed.yml"
  push:
    branches: [main]
  # Lets CodSpeed trigger backtest runs to build initial history.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  census:
    name: Benchmarks (census)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OpenID Connect authentication with CodSpeed
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.x"
          working-directory: census
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: Install dependencies
        working-directory: census
        run: uv sync --locked

      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          working-directory: census
          run: uv run --locked pytest tests/test_benchmarks.py --codspeed

  core:
    name: Benchmarks (TypeScript core)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OpenID Connect authentication with CodSpeed
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .node-version
          cache: true
          save-cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: pnpm bench
