[project]
name = "credit-census"
version = "0.1.0"
description = "How CRediT roles are used in published papers, extracted from Europe PMC JATS"
license = "MIT"
# duckdb has no 3.15 wheel yet
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb>=1.5",
    "lxml>=6",
    "pyarrow>=26",
]

[project.scripts]
census = "census.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
    "ty>=0.0.86",
    "types-lxml>=2026.2.16",
]
train = [
    "torch>=2.14",
    "transformers>=5.20",
]

[tool.uv]
# Resolve no release younger than 7 days, as Renovate already waits, so a lock refresh or a
# manual `uv add` cannot pull a release published hours ago.
exclude-newer = "7 days"
# The train group needs transformers>=5.20, and 5.20.1 (locked) came out on 2026-10-16. Drop this
# once it is a week old, after 2026-10-23, or it holds transformers at that date.
exclude-newer-package = { transformers = "2026-10-17T00:00:00Z" }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "census"

[tool.ruff.lint.per-file-ignores]
# The tests feed the en dashes publishers use.
"tests/*" = ["RUF001", "E501"]

[tool.ty.analysis]
# CI type-checks without the `train` group: torch's wheels are too large to install there.
allowed-unresolved-imports = ["torch", "transformers", "tokenizers"]
