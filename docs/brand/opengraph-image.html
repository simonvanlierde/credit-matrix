<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400;1,600&family=Atkinson+Hyperlegible+Next:wght@400;600&display=swap" rel="stylesheet">
<!-- A poster, not a screen: link previews show this at 300-500 px and some crop it near-square.
     The name, the line, the statement and the address sit in the centred 630 px (x 285-915) at a
     size that reads at a quarter scale; the matrix is the picture, on the left, and may fall
     outside the crop. One idea: the grid becomes the statement. Static markup, no script:
     regenerate rather than hand-edit the cells. -->
<style>
 *{box-sizing:border-box}
 html,body{margin:0;padding:0}
 /* The page colour is --color-surface: paper #fbf8f1 tinted 3% toward the default ink-blue. */
 body{width:1200px;height:630px;background:#f4f3ed;color:#2e2a25;overflow:hidden;position:relative;
      font-family:"Atkinson Hyperlegible Next",system-ui}
 /* People are columns, roles are rows, as in the app. The top three rows are the brand mark:
    one hue per column, lead on the diagonal. */
 .grid{position:absolute;left:56px;top:39px;display:grid;grid-template-columns:repeat(3,68px);gap:3px;z-index:1}
 .grid i{display:block;height:29px;border-radius:3px;background:#ececea}
 .grid i:nth-child(n+10):nth-child(-n+12){margin-top:12px}
 /* The app's link: the cell and the phrase it produced share the contributor's hue. */
 .grid i.linked{outline:3px solid #2a5fa8;outline-offset:3px}
 /* Ada's column and the statement share one sheet: bright paper, an ink edge, the hard sheet shadow. */
 .sheet{background:#fffdf8;border:1px solid #2e2a25;border-radius:2px;box-shadow:5px 5px 0 rgb(31 78 121/.22)}
 .col-sheet{position:absolute;left:48px;top:139px;width:84px;height:461px}
 .text{position:absolute;left:300px;top:75px;width:605px}
 .wm{font-family:Newsreader,serif;font-style:italic;font-weight:600;font-size:72px;line-height:80px;
      letter-spacing:-.02em;color:#1f4e79}
 .what{margin:10px 0 0;font-size:40px;line-height:48px;color:#5e584e;height:96px}
 .card{margin-top:26px;height:206px;padding:24px 34px}
 .stmt{margin:0;font-family:Newsreader,serif;font-size:40px;line-height:52px}
 .stmt b{font-weight:600}
 .stmt .link{white-space:nowrap;color:#2a5fa8;text-decoration:underline 3px;text-underline-offset:6px}
 .url{margin-top:26px;font-size:32px;line-height:36px;color:#5e584e}
 /* From the ringed cell, along its row, down the gutter, into the card to the phrase. */
 .leader{position:absolute;left:0;top:0;z-index:2}
</style>
