# The app at the root, and the published `credit-matrix` package in src/core.
packages:
  - src/core

minimumReleaseAge: 4320 # minutes (3 days); blocks installing very fresh (often compromised) releases

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

overrides:
  nanoid: "^3.3.18"
  postcss: "^8.5.23"
  # miniflare (via wrangler) pins undici 7.29.1, which has three advisories
  # (GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472, GHSA-xjj6-f33q-929c). Drop once wrangler moves it.
  "miniflare>undici": "7.30.1"
