pre-commit:
    parallel: true
    commands:
        biome:
            glob: "*.{js,ts,tsx,jsx,json,md,css,scss,html}"
            run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
            stage_fixed: true
prepare-commit-msg:
    commands:
        sign-off:
            # The dco workflow fails a pull request with a commit that lacks this line.
            run: 'git interpret-trailers --in-place --if-exists doNothing --trailer "Signed-off-by: $(git config user.name) <$(git config user.email)>" {1}'
commit-msg:
    commands:
        commitlint:
            run: npx --no-install commitlint --edit $1
            root: .

pre-push:
    commands:
        verify:
            run: pnpm verify
            root: .
        census:
            # "census/**/*.ext" would skip files directly in census/ (uv.lock, pyproject.toml).
            glob: "census/{**/*.py,*.toml,*.lock}"
            root: census/
            run: uv run --locked ruff format --check . && uv run --locked ruff check . && uv run --locked ty check && uv run --locked pytest -q
