# Coverage comes from one Vitest run over `src/core`, `src/lib` and
# `src/store`; its include/exclude already keep tests and e2e out of lcov, so
# nothing here needs ignore rules.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 0%
        # A docs- or config-only PR touches no measured line; don't fail it.
        if_not_found: success

# One tidy comment, and only when the numbers actually moved.
comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: true
  hide_project_coverage: false
