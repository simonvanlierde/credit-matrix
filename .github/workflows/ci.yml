name: CI

on:
  # Every PR, not only those into main: a stacked PR otherwise runs no checks
  # until its base merges.
  pull_request:
  # Main only, so a PR branch runs once (via pull_request), not twice. The
  # push run keeps the README badge on main's latest commit.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@26
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test
        run: pnpm biome check . && pnpm typecheck && pnpm test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  e2e:
    name: E2E and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@26
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser download is ~130MB and never varies for a given Playwright
      # version, so key the cache on the lockfile. `--with-deps` still runs on a
      # hit: the apt system libraries live outside this path.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      # Only Chromium is needed; skip the other browsers.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # This job builds the app before the tests run (see playwright.config.ts),
      # so it wants the same incremental cache the build job keeps.
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # The whole Playwright suite gates every push/PR: the axe scans *and*
      # the critical-workflow specs (import, undo, ORCID lookup, persistence,
      # bulk assign, export). Running only a subset here once let a regression
      # in the rest merge with CI fully green.
      #
      # Workers are left at Playwright's default (half the runner's cores).
      # Against a production build the suite runs 62s serially and 46s on two
      # workers, and the one test that failed under load was an unscoped
      # locator, not a shared-state problem: `retries: 2` covers the rest.
      # Retries also hide flakes, so watch the report's "flaky" lines: a test
      # that starts passing only on retry is a bare locator racing the
      # announce() duplicate (see e2e/happy-path.spec.ts's onScreen helper),
      # not noise to ignore.
      - name: Run Playwright suite
        env:
          CI: true
        run: pnpm exec playwright test

      # trace: "on-first-retry" is already set, so failures produce traces;
      # without this step they were thrown away and every red run had to be
      # reproduced locally.
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces
          path: test-results

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@26
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Persist Next.js' incremental build cache (.next/cache) across runs so
      # rebuilds are faster. Keyed on lockfile + source; falls back to the last
      # cache for the same deps when only source changed.
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # The static export in out/ is exactly what Cloudflare serves.
      - name: Build
        run: pnpm build

      # The real deploy runs from Cloudflare Builds on merge to main, so a bad
      # route or assets path in wrangler.jsonc would first fail in production.
      # The dry run needs no credentials.
      - name: Validate Worker config
        run: pnpm exec wrangler deploy --dry-run
