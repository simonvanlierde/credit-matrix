<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400;1,600&family=Atkinson+Hyperlegible+Mono:wght@500&family=Atkinson+Hyperlegible+Next:wght@400;600&display=swap" rel="stylesheet">
<!-- A poster, not a screen: link previews show this at 300-500 px and some crop it near-square,
     so everything that carries meaning sits in the centred 630 px and is set large enough to
     read at a quarter of its size. One idea: the statement comes from the grid. -->
<style>
 *{box-sizing:border-box}
 html,body{margin:0;padding:0}
 /* The page colour is --color-surface: paper #fbf8f1 tinted 3% toward the default ink-blue. */
 body{width:1200px;height:630px;background:#f4f3ed;color:#2e2a25;overflow:hidden;
      font-family:"Atkinson Hyperlegible Next",system-ui;
      display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:8px}
 .lock{display:flex;align-items:center;gap:18px}
 .wm{font-family:Newsreader,serif;font-style:italic;font-weight:600;font-size:64px;line-height:1;
     letter-spacing:-.02em;color:#1f4e79}
 /* The heatmap on its side, a contributor per row: the figure's own orientation option. */
 .band{margin-top:44px;display:grid;grid-template-columns:repeat(14,52px);gap:7px}
 .cell{height:40px;border-radius:3px;background:#ececea}
 /* The app's link: the cell and the phrase it produced share the contributor's hue. */
 .cell.linked{outline:3px solid #2a5fa8;outline-offset:3px}
 /* The statement sits on the app's result sheet: bright paper, an ink edge, the hard sheet shadow. */
 .out{margin-top:40px;width:460px;background:#fffdf8;border:1px solid #2e2a25;border-radius:2px;
      padding:24px 34px 26px;box-shadow:5px 5px 0 rgb(31 78 121/.22)}
 .stmt{margin:0;font-family:Newsreader,serif;font-size:36px;line-height:1.32}
 .stmt b{font-weight:600}
 .stmt .link{white-space:nowrap;color:#2a5fa8;text-decoration:underline 3px;text-underline-offset:6px}
 .url{margin-top:30px;font-size:24px;color:#5e584e}
</style>
<div class="lock">
  <svg width="54" height="54" viewBox="0 0 32 32" aria-hidden="true">
    <rect x="3" y="3" width="8" height="8" rx="1" fill="#2a5fa8"/><rect x="12" y="3" width="8" height="8" rx="1" fill="#cb7e5f"/><rect x="21" y="3" width="8" height="8" rx="1" fill="#9fc5c2"/>
    <rect x="3" y="12" width="8" height="8" rx="1" fill="#6a8fc2"/><rect x="12" y="12" width="8" height="8" rx="1" fill="#b4471a"/><rect x="21" y="12" width="8" height="8" rx="1" fill="#ececea"/>
    <rect x="3" y="21" width="8" height="8" rx="1" fill="#aabfdc"/><rect x="12" y="21" width="8" height="8" rx="1" fill="#ececea"/><rect x="21" y="21" width="8" height="8" rx="1" fill="#0f6e66"/>
  </svg>
  <span class="wm">CRediT Matrix</span>
</div>
<div class="band" id="band"></div>
<div class="out">
  <p class="stmt"><b>CRediT:</b> Ada Lovelace: Conceptualization, <span class="link">Methodology (Equal)</span>, …</p>
</div>
<div class="url">credit.duinlab.nl</div>
<script>"use strict";
// The sample that "Load sample data" loads (src/store/contribution-store.ts), in the first three
// CONTRIBUTOR_HUES at heatCellColor's lead, equal and supporting tiers (src/core/contributor-color.ts).
const tiers = [
  ["#2a5fa8", "#6a8fc2", "#aabfdc"],
  ["#b4471a", "#cb7e5f", "#e1b5a3"],
  ["#0f6e66", "#579a94", "#9fc5c2"],
];
const roles = ["Conceptualization", "Data curation", "Formal analysis", "Funding acquisition", "Investigation",
  "Methodology", "Project administration", "Resources", "Software", "Supervision", "Validation",
  "Visualization", "Writing – original draft", "Writing – review & editing"];
const scores = [
  { Conceptualization: 100, Methodology: 66, "Writing – original draft": 100, Supervision: 33 },
  { Investigation: 100, "Data curation": 100, Software: 66, "Formal analysis": 66 },
  { "Funding acquisition": 100, "Project administration": 100, "Writing – review & editing": 100, Resources: 66 },
];
const tier = (score) => (score > 66 ? 0 : score > 33 ? 1 : 2);
document.getElementById("band").innerHTML = scores
  .map((person, row) => roles.map((role) => {
    const score = person[role];
    const linked = row === 0 && role === "Methodology" ? " linked" : "";
    return `<div class="cell${linked}"${score ? ` style="background:${tiers[row][tier(score)]}"` : ""}></div>`;
  }).join(""))
  .join("");
</script>
