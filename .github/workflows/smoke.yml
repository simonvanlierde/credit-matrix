name: Smoke

# Cloudflare Workers Builds deploys main outside GitHub, so nothing here can
# gate the deploy. This checks the live site once the new commit is serving
# and fails the run (which emails the author) if it is broken. Detection only:
# rolling back automatically would need a Cloudflare deploy token in this
# repo's secrets, and a manual rollback from the dashboard takes a minute.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  SITE: https://credit.duinlab.nl

# `shell: bash` runs with -o pipefail, so a failed curl cannot hide behind a
# grep further down the pipe (the implicit default shell has no pipefail).
defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Smoke test production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # /health.json reports the commit baked in at build time; wait until it is ours.
      - name: Wait for this commit to go live
        run: |
          for _ in $(seq 1 30); do
            commit=$(curl -fsS "$SITE/health.json" | jq -r .commit || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then echo "live: $commit"; exit 0; fi
            echo "serving ${commit:-nothing}, waiting"
            sleep 20
          done
          echo "::error::$GITHUB_SHA was not live after 10 minutes"
          exit 1

      - name: App page loads
        run: curl -fsS "$SITE/" | grep -q "<title>CRediT Matrix"

      # public/_headers is the only place the CSP is set, and postbuild.mjs
      # rewrites it: a typo drops it silently, a missed rewrite ships
      # 'unsafe-inline', and the browser lookups need its connect-src.
      - name: CSP is hashed and allows the lookup APIs
        run: |
          csp=$(curl -fsSI "$SITE/" | grep -i '^content-security-policy:')
          grep -q "script-src 'self' 'sha256-" <<<"$csp"
          grep -q 'https://pub.orcid.org' <<<"$csp"

      # Hashed chunks are cached for a year, so the page that names them must
      # revalidate, or a deploy strands visitors on the old chunk list.
      - name: Cache headers
        run: |
          # Captured, not piped: under pipefail a `grep -q` that stops reading
          # early would fail the step on curl's SIGPIPE.
          page=$(curl -fsSI "$SITE/")
          sw=$(curl -fsSI "$SITE/sw.js")
          html=$(curl -fsS "$SITE/")
          [[ $html =~ (/_next/static/chunks/[^\"\\]+\.js) ]]
          asset=$(curl -fsSI "$SITE${BASH_REMATCH[1]}")
          grep -qi '^cache-control:.*max-age=0' <<<"$page"
          grep -qi '^cache-control:.*max-age=0' <<<"$sw"
          grep -qi '^cache-control:.*immutable' <<<"$asset"
