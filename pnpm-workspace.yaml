# The app at the root, and the published `credit-matrix` package in src/core.
packages:
  - src/core

minimumReleaseAge: 4320 # minutes (3 days); blocks installing very fresh (often compromised) releases

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

overrides:
  nanoid: "^3.3.18"
  postcss: "^8.5.23"

patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
