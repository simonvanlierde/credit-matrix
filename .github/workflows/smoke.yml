name: Smoke

# Cloudflare Workers Builds deploys main outside GitHub, so nothing here can
# gate the deploy. This checks the live site once the new commit is serving
# and fails the run (which emails the author) if it is broken. Detection only:
# rolling back automatically would need a Cloudflare deploy token in this
# repo's secrets, and a manual rollback from the dashboard takes a minute.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  SITE: https://credit.duinlab.nl

jobs:
  smoke:
    name: Smoke test production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # /health reports the commit baked in at build time; wait until it is ours.
      - name: Wait for this commit to go live
        run: |
          for _ in $(seq 1 30); do
            commit=$(curl -fsS "$SITE/health" | jq -r .commit || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then echo "live: $commit"; exit 0; fi
            echo "serving ${commit:-nothing}, waiting"
            sleep 20
          done
          echo "::error::$GITHUB_SHA was not live after 10 minutes"
          exit 1

      - name: Health reports ok
        run: curl -fsS "$SITE/health" | jq -e '.status == "ok"'

      - name: App page loads
        run: curl -fsS "$SITE/" | grep -q "<title>CRediT Matrix"

      # Exercises the rate-limiter binding and the ORCID upstream end to end.
      # 0000-0002-1825-0097 is ORCID's documented example record.
      - name: ORCID lookup works
        run: |-
          curl -fsS "$SITE/api/orcid" \
            -H "Origin: $SITE" \
            -H "Content-Type: application/json" \
            -d '{"id":"0000-0002-1825-0097"}' | jq -e '.ok == true'
