<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)" />
    <title>CRediT Matrix · CRediT author statement generator</title>
    <!-- A returning visitor (or a share link) never sees the prerendered first-run card: decided before first paint. Keep in step with WelcomeCard. -->
    <script>
      "use strict";
      try {
        const state = JSON.parse(localStorage.getItem("credit-generator-state"))?.state;
        const claim = state?.drafts?.[state.activeDraftId]?.claim;
        if (state?.welcomeSeen === true || claim || location.hash.startsWith("#s="))
          document.documentElement.setAttribute("data-welcome-skip", "");
      } catch {
        // Storage blocked or unreadable: the store treats it as a first visit too.
      }
    </script>
    <noscript><style>dialog[data-first-run]{display:none}</style></noscript>
    <!--metadata-->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/atkinson-next-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/atkinson-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="min-h-screen bg-surface text-on-surface">
    <div id="root"><!--app--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
