name: Smoke

# Cloudflare Workers Builds deploys main outside GitHub, so nothing here can
# gate the deploy. This checks the live site once the new commit is serving
# and fails the run (which emails the author) if it is broken. Detection only:
# rolling back automatically would need a Cloudflare deploy token in this
# repo's secrets, and a manual rollback from the dashboard takes a minute.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  SITE: https://credit.duinlab.nl

jobs:
  smoke:
    name: Smoke test production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # /health.json reports the commit baked in at build time; wait until it is ours.
      - name: Wait for this commit to go live
        run: |
          for _ in $(seq 1 30); do
            commit=$(curl -fsS "$SITE/health.json" | jq -r .commit || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then echo "live: $commit"; exit 0; fi
            echo "serving ${commit:-nothing}, waiting"
            sleep 20
          done
          echo "::error::$GITHUB_SHA was not live after 10 minutes"
          exit 1

      - name: App page loads
        run: curl -fsS "$SITE/" | grep -q "<title>CRediT Matrix"

      # public/_headers is the only place the CSP is set; a typo there drops it
      # silently, and the browser lookups need its connect-src.
      - name: CSP allows the lookup APIs
        run: curl -fsSI "$SITE/" | grep -i '^content-security-policy:' | grep -q 'https://pub.orcid.org'
