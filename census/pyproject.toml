[project]
name = "credit-census"
version = "0.1.0"
description = "How CRediT roles are used in published papers, extracted from Europe PMC JATS"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
  "duckdb>=2.0",
  "lxml>=6",
  "pyarrow>=26",
]

[project.scripts]
census = "census.cli:main"

[dependency-groups]
browser = [
  "onnx>=1.23.2",
  "onnxruntime>=1.31.0",
  "onnxscript>=0.7.2",
]
dev = [
  "pytest>=9.1",
  "pytest-codspeed>=5.0.3",
  "ruff>=0.17",
  "ty>=0.0.86",
  "types-lxml>=2026.2.16",
]
train = [
  "torch>=2.14",
  "transformers>=5.20",
]

[tool.uv]
# Resolve no release younger than 7 days, as Renovate already waits, so a lock refresh or a
# manual `uv add` cannot pull a release published hours ago.
exclude-newer = "7 days"
# setuptools 84.1.0 (2026-10-19) fixes GHSA-xmj3-9gf7-h52w. Remove this line after 2026-10-26.
exclude-newer-package = { setuptools = "2026-10-24T00:00:00Z" }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The tests feed the en dashes publishers use.
"tests/*" = ["RUF001", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "census"

[tool.ty.analysis]
# CI type-checks without the `train` and `browser` groups: torch's wheels are too large to install there.
allowed-unresolved-imports = ["torch", "transformers", "tokenizers", "onnx", "onnxruntime.**"]
