name: CI

# Caches are saved only off pull requests (main push, dispatch): an entry a PR saves is
# visible to that PR alone, and a full cache quota evicts the main entries every PR restores.
# So PRs restore the caches below but never write one. pnpm/setup keys its store on the run id,
# so only the check job saves it: one save per job would add a 294 MB entry each. The e2e
# container installs without it: its store path differs, and pnpm can't hard-link from it there.
on:
  # Every PR, not only those into main: a stacked PR otherwise runs no checks
  # until its base merges.
  pull_request:
    # The default types plus ready_for_review: a draft gets no preview, so marking
    # it ready is what starts one.
    types: [opened, synchronize, reopened, ready_for_review]
  # Main only, so a PR branch runs once (via pull_request), not twice. The
  # push run keeps the README badge on main's latest commit.
  push:
    branches: [main]
  # Weekly, for the Firefox and WebKit legs that pull requests skip.
  schedule:
    - cron: "23 4 * * 1" # Mondays, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a PR run, but a run on main may be mid-deploy. The weekly run gets a
# group of its own: a queued run replaces a pending one in its group, and the weekly run never
# deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'weekly' || 'run' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which parts a pull request touches. Web jobs skip on a census-only PR, census jobs on a PR
  # that touches neither census/ nor a workflow. Pushes and schedules run everything, and the
  # jobs below also run when this job fails or reports nothing. It also reads the Playwright
  # version for the e2e container.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # to list the pull request's files
    outputs:
      web: ${{ steps.files.outputs.web }}
      census: ${{ steps.files.outputs.census }}
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false

      # The e2e container's tag must match the locked @playwright/test exactly.
      - id: playwright
        run: |
          version=$(grep -oPm1 "^  '@playwright/test@\K[0-9.]+(?=':)" pnpm-lock.yaml)
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - id: files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # A renamed file counts at its old path too, so a move out of a part runs its checks.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          web=false census=false
          grep -qv '^census/' <<<"$files" && web=true
          grep -qE '^(census/|\.github/workflows/)' <<<"$files" && census=true
          # Tests that read the other part's files: src/core/__tests__/statement.test.ts reads
          # the parser parity corpus, census/tests/test_jats.py reads the CRediT slugs.
          grep -qE '^census/(tests/corpus\.jsonl|src/census/(statement|roles)\.py)$' <<<"$files" && web=true
          grep -qx 'src/core/credit-roles.ts' <<<"$files" && census=true
          echo "web=$web" >>"$GITHUB_OUTPUT"
          echo "census=$census" >>"$GITHUB_OUTPUT"
          echo "web=$web census=$census"

  check:
    name: Check
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .node-version
          cache: true
          save-cache: ${{ github.event_name != 'pull_request' }}
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Syntax errors and duplicate keys in every JSON, JSONC and JSON5 file,
      # renovate.json5 included, which biome skips. After the install, so the
      # $schema paths in biome.json and wrangler.jsonc resolve and both files are
      # also checked against their schemas.
      - uses: simonvanlierde/jsonvet@83df66110a108e0fa4b7d2b2adcef6831f618e05 # v3.3.1

      # integrations/quarto/credit-matrix.test.ts renders a document with the filter.
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      # integrations/typst/credit-matrix.test.ts compiles the Typst package's examples.
      - uses: typst-community/setup-typst@6a2cfaf0b28d636b00148f965e315bae81079aaa # v5.3.1
        with:
          typst-version: 0.15.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.x"
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: Install PDF inspection tools
        run: sudo apt-get update -q && sudo apt-get install -yq poppler-utils
      # `verify` is the pre-push gate: lint, types, unit tests and document builds.
      # The coverage output feeds Codecov below.
      - name: Lint, typecheck, test
        run: pnpm verify

      # The JATS4R rules and SchXslt2 are pinned in the script, so its hash is the key.
      - name: Cache the JATS4R rules (restore only on a pull request)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/jats4r
          key: ${{ runner.os }}-jats4r-${{ hashFiles('scripts/validate-jats.sh') }}

      - name: Cache the JATS4R rules
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/jats4r
          key: ${{ runner.os }}-jats4r-${{ hashFiles('scripts/validate-jats.sh') }}

      - name: Validate the JATS export against the JATS 1.3 DTD and the JATS4R rules
        run: |
          command -v xmllint || { sudo apt-get update -q && sudo apt-get install -yq libxml2-utils; }
          pnpm validate:jats

      # The schema archive is pinned by hash in the script, so its hash is the key.
      - name: Cache the Crossref schema (restore only on a pull request)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/crossref
          key: ${{ runner.os }}-crossref-${{ hashFiles('scripts/validate-crossref.sh') }}

      - name: Cache the Crossref schema
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/crossref
          key: ${{ runner.os }}-crossref-${{ hashFiles('scripts/validate-crossref.sh') }}

      # XSD 1.1 needs xmlschema through uvx; xmllint cannot read it.
      - name: Validate the Crossref export against the Crossref schema 5.5.0
        run: pnpm validate:crossref

      # The release lifecycle rewrites these files from package.json; a hand edit or a missed
      # run shows as a diff. Staged by the script, so compare against HEAD.
      - name: Check the citation files are in step with package.json
        run: |
          npm_package_version=$(jq -r .version package.json) bash scripts/sync-citation.sh
          git diff --exit-code HEAD -- CITATION.cff codemeta.json CITATION.bib citation.csl.json citation.apa.txt schema.jsonld

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  # The package supports older Node than the repo builds with, so run the built
  # CLI on the oldest supported line and the previous LTS.
  cli-node:
    name: CLI on Node ${{ matrix.node }}
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .node-version
          cache: true
          save-cache: false
          install: false

      - name: Build the package
        run: |
          pnpm install --frozen-lockfile --filter credit-matrix... --include-workspace-root
          pnpm --filter credit-matrix build

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Run the CLI
        run: |
          node --version
          printf 'Name,Conceptualization,Software\nAda Lovelace,100,66\n' > team.csv
          node src/core/dist/cli.js statement team.csv
          node src/core/dist/cli.js convert team.csv --to jats > /dev/null

  census:
    name: Census
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.census != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: census
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.x"
          working-directory: census
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: Lint, typecheck, test
        run: |
          uv sync --locked --group tracking
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .
          uv run --no-sync ty check
          uv run --no-sync python -c "import mlflow, sqlalchemy, alembic"
          uv run --no-sync pytest -q

  # Trains two epochs of a tiny random ModernBERT and predicts with it, on CPU. The locked torch is the
  # CUDA build (several GB), so the CPU wheel goes in over the locked environment instead.
  census-train:
    name: Census train smoke test
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.census != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: census
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.x"
          working-directory: census
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: Install the CPU training stack
        run: |
          uv sync --locked
          # The locked versions, so the job tests what training uses; ==2.14.1 also matches 2.14.1+cpu.
          pins=$(uv export --locked --only-group train --no-hashes --no-header --no-emit-project |
            grep -E '^(torch|transformers)==' | cut -d' ' -f1)
          # shellcheck disable=SC2086 # one word per pin
          uv pip install $pins \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple --index-strategy unsafe-best-match
          # The tests skip without torch: fail here instead of passing on nothing.
          uv run --no-sync python -c "import torch, transformers"

      - name: Train and predict
        run: uv run --no-sync pytest -q tests/test_encoder.py -k "train or predict"

  # One leg per browser, in parallel. Pull requests run Chromium only: Firefox and WebKit took
  # 65% of a PR's runner minutes. Pushes to main and the weekly run test all three, and the
  # deploy waits on them. The e2e-result job reports the check the ruleset requires.
  e2e:
    name: E2E (${{ matrix.browser }})
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The browsers and their system libraries come with the image. Installing WebKit's with apt
    # on the runner stalled past the job timeout three times in a week. The runner's uid, as in
    # Playwright's CI docs, so the job runs as the user that owns the workspace.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble # zizmor: ignore[unpinned-images] the tag comes from the lockfile
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(github.event_name == 'pull_request' && '["chromium"]' || '["chromium","firefox","webkit"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .node-version
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pinned wheels and the copied Pyodide runtime (scripts/vendor-citesync.mjs), so a
      # build downloads nothing from PyPI unless the manifest or the lockfile changes.
      - name: Cache the citation converter (restore only on a pull request)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: public/citesync
          key: ${{ runner.os }}-citesync-${{ hashFiles('scripts/citesync-runtime.json', 'pnpm-lock.yaml') }}

      - name: Cache the citation converter
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: public/citesync
          key: ${{ runner.os }}-citesync-${{ hashFiles('scripts/citesync-runtime.json', 'pnpm-lock.yaml') }}

      # The whole Playwright suite gates every push/PR: the axe scans *and*
      # the critical-workflow specs (import, undo, ORCID lookup, persistence,
      # bulk assign, export). Running only a subset here once let a regression
      # in the rest merge with CI fully green.
      #
      # Workers are left at Playwright's default (half the runner's cores).
      # Against a production build the suite runs 62s serially and 46s on two
      # workers, and the one test that failed under load was an unscoped
      # locator, not a shared-state problem: `retries: 2` covers the rest.
      # Retries also hide flakes, so watch the report's "flaky" lines: a test
      # that starts passing only on retry is a bare locator racing the
      # announce() duplicate (see e2e/happy-path.spec.ts's onScreen helper),
      # not noise to ignore.
      - name: Run Playwright suite
        env:
          CI: true
          BROWSER: ${{ matrix.browser }}
        run: pnpm exec playwright test --project="$BROWSER"

      # trace: "on-first-retry" is already set, so failures produce traces;
      # without this step they were thrown away and every red run had to be
      # reproduced locally.
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: test-results

  # The check the ruleset requires. A matrix job skipped by its `if` (a census-only PR) reports
  # no leg under any expanded name, so a required leg would wait forever. Skipped passes here;
  # a failed or cancelled leg fails.
  e2e-result:
    name: E2E and accessibility
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "e2e: $RESULT"
          [[ $RESULT == success || $RESULT == skipped ]]

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .node-version
          cache: true
          save-cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pinned wheels and the copied Pyodide runtime (scripts/vendor-citesync.mjs), so a
      # build downloads nothing from PyPI unless the manifest or the lockfile changes.
      - name: Cache the citation converter (restore only on a pull request)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: public/citesync
          key: ${{ runner.os }}-citesync-${{ hashFiles('scripts/citesync-runtime.json', 'pnpm-lock.yaml') }}

      - name: Cache the citation converter
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: public/citesync
          key: ${{ runner.os }}-citesync-${{ hashFiles('scripts/citesync-runtime.json', 'pnpm-lock.yaml') }}

      # The static export in out/ is exactly what Cloudflare serves.
      - name: Build
        run: pnpm build

      # The app's JavaScript stays under the gzip budget in scripts/check-bundle-size.mjs.
      - name: Check bundle size
        run: pnpm check:bundle

      # The deploy job ships this exact out/, so a bad route or assets path in
      # wrangler.jsonc is caught here first. The dry run needs no credentials.
      - name: Validate Worker config
        run: pnpm exec wrangler deploy --dry-run

      - name: Upload static export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: out
          path: out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # docs/deploy.md has the preview lifecycle. Fork PRs never get the token, so they
  # skip with a notice, as does a run without the secret.
  preview:
    name: Preview
    # Bot pull requests (Renovate) get no preview, so their code never sees the token.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'pull_request' && !github.event.pull_request.draft && !endsWith(github.event.pull_request.user.login, '[bot]') }}
    # Shares preview-retire.yml's group, so a retire waits for a deploy in flight.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    timeout-minutes: 10
    needs: [build]
    permissions:
      contents: read
      pull-requests: read # to re-read the PR's state before the deploy
    steps:
      - name: Check credentials
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FORK" = "true" ] || [ -z "$TOKEN" ]; then
            echo "::notice::Preview skipped: fork PR or CLOUDFLARE_API_TOKEN not set."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .node-version
          cache: true
          save-cache: false
          install: false

      - if: steps.gate.outputs.run == 'true'
        name: Install dependencies
        run: pnpm install --frozen-lockfile

      - if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: out
          path: out

      # Search engines should index the production site, not the preview copies. This
      # appends to the build's own _headers, which keeps its security headers.
      - if: steps.gate.outputs.run == 'true'
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex\n' >> out/_headers

      - if: steps.gate.outputs.run == 'true'
        name: Deploy preview Worker
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        # pipefail: the default shell takes the pipe's status from tee, so a
        # refused upload would otherwise pass.
        run: |
          set -o pipefail
          # The event may be minutes old. Read the PR now, so a late upload cannot
          # bring back the preview of a PR that has closed or turned draft since.
          state=$(gh api "repos/$REPO/pulls/$PR" --jq '.state + " " + (.draft|tostring)')
          if [ "$state" != "open false" ]; then
            echo "::notice::Preview skipped: PR $PR is no longer open and ready ($state)."
            exit 0
          fi
          pnpm exec wrangler deploy --config wrangler.preview.jsonc \
            --name "credit-matrix-pr-$PR" --message "PR $PR at $SHA" 2>&1 | tee deploy.log
          url=$(grep -Eo 'https://[^ ]+\.workers\.dev' deploy.log | head -n 1 || true)
          if [ -z "$url" ]; then
            echo "::error::Deployed, but wrangler printed no workers.dev address. Check workers_dev in wrangler.preview.jsonc."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"

  # Provenance for the exact files the deploy job ships. Kept apart from
  # deploy so the OIDC token never sits in a job that runs project code.
  attest:
    name: Attest
    # The explicit results: by default a failed changes job would skip this job, though the
    # jobs it feeds run anyway.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: out
          path: out

      # One subject per file, so each served file can be checked on its own.
      # The action caps a run at 1024 subjects; the export has under 100.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'out/**'

  # Production deploy of the build job's out/, after every check passes.
  # The secrets live in the `production` environment, limited to main.
  deploy:
    name: Deploy
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.check.result == 'success' && needs.e2e.result == 'success'
      && needs.build.result == 'success' && needs.attest.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check, e2e, build, attest]
    environment: production
    # Serialise deploys; never cancel one half way.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .node-version
          cache: true
          save-cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: out
          path: out

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |-
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Deploy skipped: CLOUDFLARE_API_TOKEN is not set."
            echo "Deploy skipped: CLOUDFLARE_API_TOKEN is not set." >> "$GITHUB_STEP_SUMMARY"
          else
            pnpm exec wrangler deploy
          fi
