name: licenses

# Lists the production dependencies by licence and fails on one that cannot ship
# in an MIT-licensed app: a strong copyleft licence or none declared.
on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/licenses.yml
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1" # Mondays, 05:23 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: .node-version
          cache: false
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: List licences
        # An SPDX expression such as "(MIT OR GPL-3.0)" passes when any branch is allowed.
        # LGPL is allowed on purpose: a dependency linked from a bundle stays replaceable.
        run: |
          pnpm licenses list --prod --json > licenses.json
          node -e '
            const l = require("./licenses.json");
            for (const [k, v] of Object.entries(l)) console.log(`${k}: ${v.length}`);
            const disallowed = (b) => /GPL|SSPL|BUSL|Unknown|UNLICENSED/i.test(b) && !/LGPL/i.test(b);
            const bad = Object.keys(l).filter((k) => k.replace(/[()]/g, "").split(/\s+OR\s+/).every(disallowed));
            if (bad.length) { console.error("Incompatible licences: " + bad.join(", ")); process.exit(1); }
          '
