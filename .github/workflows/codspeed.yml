name: CodSpeed

on:
  pull_request:
  push:
    branches: [main]
  # Lets CodSpeed trigger backtest runs to build initial history.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  census:
    name: Benchmarks (census)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.x"
          working-directory: census
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: Install dependencies
        working-directory: census
        run: uv sync --locked

      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          working-directory: census
          run: uv run --locked pytest tests/test_benchmarks.py --codspeed
