name: Retire preview

# Deletes the preview Worker of a pull request that closes or turns draft, and sweeps
# daily for any that were missed. docs/deploy.md has the rest.
on:
  pull_request:
    types: [closed, converted_to_draft]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      prs:
        description: PR numbers to retire, separated by spaces. Leave empty to run the daily sweep.
        required: false

permissions:
  contents: read

# Shares ci.yml's preview group, so a retire waits for a deploy in flight.
concurrency:
  group: preview-${{ github.event.pull_request.number || github.run_id }}

jobs:
  retire:
    name: Retire
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # the sweep reads each PR's state
    steps:
      - name: Check credentials
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::Nothing to retire: CLOUDFLARE_API_TOKEN is not set."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # The base branch's script: a closed pull request may have no merge ref left.
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - if: steps.gate.outputs.run == 'true'
        name: Delete the preview Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SLUG: credit-matrix
          PRS: ${{ github.event.pull_request.number || inputs.prs }}
        # The script is a copy of the project-templates one, which check-render tests.
        # credit-matrix-preview is the shared Worker of the earlier preview design.
        run: .github/scripts/preview-retire.sh credit-matrix-preview
