# The app at the root, and the published `credit-matrix` package in src/core.
packages:
  - src/core

minimumReleaseAge: 10080 # minutes (7 days), as in renovate.json5; blocks installing very fresh (often compromised) releases

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

overrides:
  nanoid: "^3.3.18"
  postcss: "^8.5.23"
