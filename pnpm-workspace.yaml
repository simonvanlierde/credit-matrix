# The app at the root, and the published `credit-matrix` package in src/core.
packages:
  - src/core

minimumReleaseAge: 4320 # minutes (3 days); blocks installing very fresh (often compromised) releases

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

overrides:
  nanoid: "^3.3.18"
  postcss: "^8.5.23"

# Fixed upstream in @stryker-mutator/vitest-runner 10.1.0 (stryker-js #6214, #6269; 10.1.1 is the re-release on npm). Drop this patch, its Renovate rule and the CONTRIBUTING sentence with the bump to 10.1.1, installable from 2026-10-27.
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
