name: Release package

# Publishes src/core as the `credit-matrix` npm package when a release is tagged, after
# src/fonts as `credit-matrix-fonts` when that version is not on npm yet.
# npm trusted publishing: npm checks this workflow's GitHub OIDC token, so
# there is no npm token to store or leak. docs/deploy.md has the one-time setup.
#
# `build` installs and runs project code with read-only rights and
# packs the tarball; `publish` holds the OIDC token, runs in the `npm-release`
# environment (limited to v* tags) and only uploads that tarball. `release`
# attests the same archive and prepares a draft for the owner to publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test the package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      fonts-tarball: ${{ steps.pack-fonts.outputs.tarball }}
    steps:
      # Full history, so the check below can see whether the tag is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main."
            exit 1
          fi

      # No dependency cache: a release builds only from the lockfile.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .node-version
          cache: false
          install: false

      # Packed at every release; publish uploads it only when its version is new. The fonts have no
      # build step, so they are packed before any dependency is installed and can run code.
      - name: Pack the fonts
        id: pack-fonts
        working-directory: src/fonts
        run: |
          set -o pipefail
          tarball=$(npm pack --ignore-scripts --silent | tail -n 1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fonts
          path: src/fonts/${{ steps.pack-fonts.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the package version
        run: |
          version=$(node -p 'require("./src/core/package.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match src/core/package.json version $version."
            exit 1
          fi

      # Builds dist/ (global setup), then runs every core test against it.
      - name: Test the package
        run: pnpm exec vitest run --project core

      # prepack rebuilds dist/ before the tarball is made.
      - name: Pack
        id: pack
        working-directory: src/core
        # pipefail: otherwise a failed pack leaves tarball empty and the
        # upload below takes the whole src/core directory instead.
        run: |
          set -o pipefail
          tarball=$(npm pack --silent | tail -n 1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package
          path: src/core/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

      - name: Generate the package SBOM
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        # Include build dependencies: the CLI and MyST plugin bundle some of them.
        run: pnpm --filter credit-matrix sbom --sbom-format cyclonedx --sbom-spec-version 1.6 --out "$TARBALL.cdx.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: ${{ steps.pack.outputs.tarball }}.cdx.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      # Only the version file the setup step reads; nothing from the repo runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .node-version
          sparse-checkout-cone-mode: false

      # setup-node, not pnpm/setup: pnpm's Node runtime comes without npm, so
      # `npm` would be the runner's older system npm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # A release never restores a cache another run could have written.
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fonts

      - name: Check npm supports trusted publishing
        run: |
          version=$(npm --version)
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$version"; then
            echo "::error::npm $version is too old for trusted publishing (needs 11.5.1 or later)."
            exit 1
          fi

      # Before the main package: its font download points at this version.
      - name: Publish the fonts when their version is new
        env:
          TARBALL: ${{ needs.build.outputs.fonts-tarball }}
        run: |
          set -o pipefail
          version=$(tar -xOzf "$TARBALL" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          local_integrity="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)"
          # Core pins the font hashes, so a published version must be this exact tarball.
          if published=$(npm view "credit-matrix-fonts@$version" dist.integrity 2> npm-view.log); then
            if [ -z "$published" ]; then
              npm publish "./$TARBALL" --provenance --access public
            elif [ "$published" = "$local_integrity" ]; then
              echo "credit-matrix-fonts $version is already on npm, with these files."
            else
              echo "::error::credit-matrix-fonts $version on npm differs from src/fonts. Bump its version."
              exit 1
            fi
          elif grep -q E404 npm-view.log; then
            npm publish "./$TARBALL" --provenance --access public
          else
            cat npm-view.log
            exit 1
          fi

      - name: Publish
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./$TARBALL" --provenance --access public

  release:
    name: Prepare the GitHub release
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom

      - name: Attest the package
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ needs.build.outputs.tarball }}

      - name: Attest the SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ needs.build.outputs.tarball }}
          sbom-path: ${{ needs.build.outputs.tarball }}.cdx.json

      - name: Verify and attach the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARBALL: ${{ needs.build.outputs.tarball }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |-
          gh attestation verify "$TARBALL" --repo "$GH_REPO"
          gh attestation verify "$TARBALL" --repo "$GH_REPO" --predicate-type https://cyclonedx.org/bom
          cp "$PROVENANCE_BUNDLE" "$TARBALL.intoto.jsonl"
          cp "$SBOM_BUNDLE" "$TARBALL.cdx.json.intoto.jsonl"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes \
            "$TARBALL" "$TARBALL.intoto.jsonl" "$TARBALL.cdx.json" "$TARBALL.cdx.json.intoto.jsonl"
