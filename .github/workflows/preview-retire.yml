name: Retire preview

# A preview is a Worker of its own, credit-matrix-pr-<number>, so retiring it means
# deleting the Worker. The job then fetches the address and fails unless it has stopped
# serving the build. A daily run lists the account's preview Workers and deletes each one
# whose pull request is not open and ready, which also covers events that never ran. Run
# it by hand with a list of pull request numbers to retire those previews now, or with the
# list empty to run the sweep.
on:
  pull_request:
    types: [closed, converted_to_draft]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      prs:
        description: PR numbers to retire, separated by spaces. Leave empty to run the daily sweep.
        required: false

permissions:
  contents: read

# Shares ci.yml's preview group, so a retire waits for a deploy in flight.
concurrency:
  group: preview-${{ github.event.pull_request.number || github.run_id }}

jobs:
  retire:
    name: Retire
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # to re-read each PR's state before the sweep deletes its Worker
    steps:
      - name: Check credentials
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::Nothing to retire: CLOUDFLARE_API_TOKEN is not set."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.run == 'true'
        name: Delete the preview Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PRS: ${{ github.event.pull_request.number || inputs.prs }}
        run: |
          set -o pipefail
          failed=0
          names=""
          if [ "$EVENT" = schedule ] || [ -z "$PRS" ]; then
            # Every preview Worker whose PR is not open and ready. The PR is read again
            # here, just before the delete, so a PR that became ready since the list
            # was made keeps its preview.
            PRS=""
            all=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
              | jq -r '.result[].id') || { echo "::error::Could not list the account's Workers."; exit 1; }
            for name in $(grep -E '^credit-matrix-pr-[0-9]+$' <<< "$all" || true); do
              n=${name#credit-matrix-pr-}
              [ "$(gh api "repos/$REPO/pulls/$n" --jq '.state, .draft' | paste -sd' ')" = "open false" ] || PRS="$PRS $n"
            done
            # The Worker the alias design created; its version URL still serves a build.
            if grep -qx 'credit-matrix-preview' <<< "$all"; then names="credit-matrix-preview"; fi
          fi
          for pr in $PRS; do
            case "$pr" in *[!0-9]*|'') echo "::error::Not a PR number: $pr"; exit 1 ;; esac
            names="$names credit-matrix-pr-$pr"
          done
          for name in $names; do
            # The API rather than `wrangler delete`: that also lists KV namespaces, which the
            # token has no right to read. A pull request that never had a preview has no
            # Worker, and the API answers 404: not an error.
            status=$(curl -sS -o delete.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name?force=true" || true)
            case "$status" in
              200) echo "Deleted $name." ;;
              404) echo "::notice::$name does not exist, so there is nothing to retire." ;;
              *) echo "::error::Could not delete $name (HTTP $status): $(cat delete.json)"; failed=1; continue ;;
            esac
            # The address is the Worker's name plus the account's workers.dev subdomain.
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | jq -r '.result.subdomain')
            if [ -z "$sub" ] || [ "$sub" = null ]; then
              echo "::error::Could not read the account's workers.dev subdomain, so takedown of $name is unverified."
              failed=1
              continue
            fi
            url="https://$name.$sub.workers.dev"
            # The delete takes a moment to reach every edge: retry with backoff.
            code=000
            for wait in 5 10 20 40 60; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' "$url" || true)
              [ "$code" != 200 ] && break
              sleep "$wait"
            done
            if [ "$code" = 200 ]; then
              echo "::error::$url still serves the build after the delete."
              failed=1
            else
              echo "Retired $name: $url answers HTTP $code" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$failed"
