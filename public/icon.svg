<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CRediT Matrix">
  <!-- A 3x3 crop of the contribution matrix, one column per contributor in the
       first three CONTRIBUTOR_HUES. Fills are heatCellColor's lead, equal and
       supporting tiers (src/core/contributor-color.ts), light and dark, plus
       the empty-cell fill. Ground and edge are the paper and outline tokens. -->
  <style>
    .ground { fill: #fbf8f1 } .edge { stroke: #d6ccba } .none { fill: #ececea }
    .a0 { fill: #2a5fa8 } .a1 { fill: #6a8fc2 } .a2 { fill: #aabfdc } .b0 { fill: #b4471a } .b1 { fill: #cb7e5f } .b2 { fill: #e1b5a3 } .c0 { fill: #0f6e66 } .c1 { fill: #579a94 } .c2 { fill: #9fc5c2 }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #161513 } .edge { stroke: #4a463f } .none { fill: #292723 }
      .a0 { fill: #a1bfe8 } .a1 { fill: #316fc4 } .a2 { fill: #1f457a } .b0 { fill: #eab59e } .b1 { fill: #ca592b } .b2 { fill: #7e381b } .c0 { fill: #9eeae4 } .c1 { fill: #2bcabd } .c2 { fill: #1b7e76 }
    }
  </style>
  <rect class="ground" width="32" height="32" rx="6"/>
  <rect class="edge" x=".5" y=".5" width="31" height="31" rx="5.5" fill="none"/>
  <rect x="3" y="3" width="8" height="8" rx="1" class="a0"/><rect x="12" y="3" width="8" height="8" rx="1" class="b1"/><rect x="21" y="3" width="8" height="8" rx="1" class="c2"/>
  <rect x="3" y="12" width="8" height="8" rx="1" class="a1"/><rect x="12" y="12" width="8" height="8" rx="1" class="b0"/><rect x="21" y="12" width="8" height="8" rx="1" class="none"/>
  <rect x="3" y="21" width="8" height="8" rx="1" class="a2"/><rect x="12" y="21" width="8" height="8" rx="1" class="none"/><rect x="21" y="21" width="8" height="8" rx="1" class="c0"/>
</svg>
